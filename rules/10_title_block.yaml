# Rule nhom A - khung ten & metadata (Phase 1, dung theo dinh dang muc 7.1 tai lieu ke hoach).
# Chi gom cac rule dung duoc primitive co san (field_present/field_matches/field_in_catalog/
# field_equals_project). Rule TB-014 (custom, doi chieu bang sua doi) CHUA dua vao day - can
# them field revision_history vao TitleBlock va viet checks/revision.py truoc (Phase 2).
version: 1
ruleset: title_block
applies_to:
  standard: [iso, jis]

rules:
  - id: TB-001
    name: "Thieu ma ban ve"
    severity: critical
    confidence_gate: 0.95
    check: field_present
    params: { field: title_block.drawing_no }
    message_vi: "Khung ten thieu ma ban ve."
    fix_hint: "Dien ma ban ve theo quy tac dat ten cua du an."

  - id: TB-002
    name: "Ma ban ve sai dinh dang"
    severity: major
    check: field_matches
    params:
      field: title_block.drawing_no
      pattern_from_project: drawing_no_pattern
    message_vi: "Ma '{value}' khong khop quy tac dat ten da khai bao cho du an nay."

  - id: TB-007
    name: "Thieu nguoi kiem tra"
    severity: major
    check: field_present
    params: { field: title_block.checked_by }
    message_vi: "Chua co nguoi kiem tra. Ban ve khong duoc phat hanh khi chua qua kiem."

  - id: TB-003
    name: "Thieu ty le"
    severity: major
    check: field_present
    params: { field: title_block.scale }
    message_vi: "Khung ten thieu ty le ban ve (scale)."
    fix_hint: "Dien ty le dang x:y, vd 1:2 hoac 2:1."

  - id: TB-004
    name: "Ty le sai dinh dang"
    severity: major
    check: field_matches
    params:
      field: title_block.scale
      # x:y trong do 1 ben = 1, ben con lai thuoc day so uu tien ISO; rieng 2:3/3:2/2:5/5:2
      # duoc cong ty chap nhan them (xac nhan voi nguoi dung 2026-08-23).
      pattern: '^(1:(1|1\.5|2|2\.5|3|4|5|6|8|10|12|15|20|25|30|35|40|45|50|60|70|80|90|100)|(1|1\.5|2|2\.5|3|4|5|6|8|10|12|15|20|25|30|35|40|45|50|60|70|80|90|100):1|2:3|3:2|2:5|5:2)$'
    message_vi: "Ty le '{value}' khong hop le - phai dang x:y voi 1 ben = 1 (hoac 2:3/3:2/2:5/5:2)."

  - id: TB-005
    name: "Thieu dung sai chung"
    severity: major
    check: field_present
    params: { field: title_block.general_tol }
    message_vi: "Khung ten thieu dung sai chung (general tolerance)."
    fix_hint: "Dien dung sai chung theo chuan da khai bao cho du an, vd (ISO 2768-1)."

  - id: TB-006
    name: "Thieu so to"
    severity: major
    check: field_present
    params: { field: title_block.sheet }
    message_vi: "Khung ten thieu so to (sheet)."
    fix_hint: "Dien dang x/y, vd 1/1 neu ban ve chi co 1 to."

  - id: TB-008
    name: "So to sai dinh dang hoac khong hop le"
    severity: major
    check: custom
    params:
      field: title_block.sheet
      handler: sheet_khong_hop_le
    message_vi: "So to '{value}' khong hop le - phai dang x/y voi 1<=x<=y."
    fix_hint: "Kiem tra lai so to hien tai (x) va tong so to (y) cua ban ve, dam bao 1<=x<=y."

  - id: TB-011
    name: "Vat lieu khong co trong danh muc"
    severity: critical
    check: field_in_catalog
    params:
      field: title_block.material
      catalog: materials
    message_vi: "Vat lieu '{value}' khong co trong danh muc vat lieu cong ty."
    fix_hint: "Dung ky hieu chuan, vd SS400, S45C, SUS304, A5052."

  - id: PROJ-001
    name: "Thieu ky hieu goc chieu"
    severity: critical
    confidence_gate: 0.5
    check: field_present
    params: { field: title_block.projection }
    message_vi: "Ban ve khong ghi ky hieu goc chieu - nguy co gia cong lat guong."
    fix_hint: >
      Ky hieu goc chieu la HINH VE (cone/circle), khong phai text - duong PDF text khong doc
      duoc field nay (confidence luon thap, rule chi len muc WARN). Can nguoi kiem tra xac nhan
      bang mat, hoac cho toi Phase 4 (nhan dang hinh anh) moi tu dong hoa duoc.

  - id: PROJ-002
    name: "Goc chieu sai chuan du an"
    severity: critical
    confidence_gate: 0.5
    check: field_equals_project
    params:
      field: title_block.projection
      project_key: projection_angle
    message_vi: "Ban ve ghi goc chieu '{value}' nhung du an nay dung chuan khac."
